<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Generate a memorable password in the format 123-Red-Dog.">
  <title>Memorable Password Generator</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --background: #f4f7fb;
      --surface: #ffffff;
      --text: #182033;
      --muted: #63708a;
      --border: #dbe2ee;
      --primary: #2457d6;
      --primary-hover: #1848bd;
      --primary-text: #ffffff;
      --focus: #6e9bff;
      --shadow: 0 18px 50px rgba(31, 52, 90, 0.13);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111827;
        --surface: #1d2738;
        --text: #f5f7fb;
        --muted: #aab6ca;
        --border: #354157;
        --primary: #78a1ff;
        --primary-hover: #95b5ff;
        --primary-text: #0d1930;
        --focus: #9bb9ff;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, color-mix(in srgb, var(--primary) 13%, transparent), transparent 36%),
        var(--background);
      color: var(--text);
    }

    main {
      width: min(100%, 560px);
      padding: clamp(24px, 6vw, 44px);
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 7vw, 2.35rem);
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .intro {
      margin: 12px 0 28px;
      color: var(--muted);
    }

    .password-box {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 14px;
      text-align: center;
      background: color-mix(in srgb, var(--primary) 5%, var(--surface));
    }

    output {
      display: block;
      overflow-wrap: anywhere;
      font: 700 clamp(1.45rem, 7vw, 2.15rem) / 1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: -0.03em;
    }

    .format {
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      min-height: 48px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
    }

    button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: var(--primary-text);
    }

    button:hover {
      border-color: var(--primary);
    }

    button.primary:hover {
      background: var(--primary-hover);
    }

    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .note {
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 0.83rem;
      line-height: 1.5;
    }

    @media (max-width: 440px) {
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Memorable password generator</h1>
    <p class="intro">Create a random password using a number, colour and animal.</p>

    <section class="password-box" aria-label="Generated password">
      <output id="password" aria-live="polite"></output>
      <div id="status" class="format" aria-live="polite">3-digit number · colour · animal</div>
    </section>

    <div class="actions">
      <button id="generate" class="primary" type="button">Generate password</button>
      <button id="copy" type="button">Copy password</button>
    </div>

    <p class="note">This memorable format has limited combinations. Use a password manager for email, banking and other sensitive accounts.</p>
  </main>

  <script>
    (() => {
      const passwordOutput = document.getElementById("password");
      const status = document.getElementById("status");
      const generateButton = document.getElementById("generate");
      const copyButton = document.getElementById("copy");

      const colours = [
        "Red", "Blue", "Green", "Yellow", "Orange", "Purple", "Pink", "Silver",
        "Gold", "Black", "White", "Brown", "Teal", "Indigo", "Violet", "Coral"
      ];

      const animals = [
        "Dog", "Cat", "Fox", "Bear", "Tiger", "Lion", "Panda", "Otter",
        "Rabbit", "Badger", "Falcon", "Dolphin", "Koala", "Gecko", "Moose", "Zebra"
      ];

      function secureInteger(maxExclusive) {
        const range = 0x100000000;
        const limit = range - (range % maxExclusive);
        const values = new Uint32Array(1);

        do {
          crypto.getRandomValues(values);
        } while (values[0] >= limit);

        return values[0] % maxExclusive;
      }

      function generatePassword() {
        const number = 100 + secureInteger(900);
        const colour = colours[secureInteger(colours.length)];
        const animal = animals[secureInteger(animals.length)];

        passwordOutput.textContent = `${number}-${colour}-${animal}`;
        status.textContent = "3-digit number · colour · animal";
        copyButton.textContent = "Copy password";
      }

      async function copyPassword() {
        const password = passwordOutput.textContent;

        try {
          await navigator.clipboard.writeText(password);
        } catch {
          const textArea = document.createElement("textarea");
          textArea.value = password;
          textArea.setAttribute("readonly", "");
          textArea.style.position = "fixed";
          textArea.style.opacity = "0";
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand("copy");
          textArea.remove();
        }

        copyButton.textContent = "Copied!";
        status.textContent = "Password copied to clipboard";
      }

      generateButton.addEventListener("click", generatePassword);
      copyButton.addEventListener("click", copyPassword);
      generatePassword();
    })();
  </script>
</body>
</html>
