<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Generate a memorable password in the format 123-Red-Dog.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';">
  <title>Memorable Password Generator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Memorable password generator</h1>
    <p class="intro">Create a random password using a number, colour and animal.</p>

    <section class="password-box" aria-label="Generated password">
      <output id="password" aria-live="polite"></output>
      <div id="status" class="format" aria-live="polite">3-digit number · colour · animal</div>
    </section>

    <div class="actions">
      <button id="generate" class="primary" type="button">Generate password</button>
      <button id="copy" type="button">Copy password</button>
    </div>

    <p class="note">This memorable format has limited combinations. Use a password manager for email, banking and other sensitive accounts.</p>
  </main>
</body>
</html>
